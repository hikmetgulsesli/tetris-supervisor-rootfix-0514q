    -->
<div class="absolute inset-0 flex justify-center items-center pointer-events-none z-0">
<div class="flex gap-lg">
<!-- Left Panel: Held Piece -->
<div class="hidden md:flex flex-col gap-sm">

</div>
</div>
</div>

<div class="absolute inset-0 bg-grid-pattern opacity-50"></div>

<div class="absolute bottom-0 w-full flex flex-wrap gap-[1px] justify-start p-[1px]">

<div class="w-[30.5px] h-[30.5px] bg-outline-variant/40"></div>

      Dimmed backdrop with blurred background to focus attention on the menu.

<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause_circle</span>

            </h1>

<span class="material-symbols-outlined text-on-primary-container group-hover:scale-110 transition-transform">play_arrow</span>
                    RESUME
                </button>
