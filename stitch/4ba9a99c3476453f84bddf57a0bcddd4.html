<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Over - TETRA-FLOW</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-dim": "#0f1418",

                        "on-secondary": "#3c0091",
                        "tertiary": "#ffc176",
                        "surface-variant": "#303539",

                        "tertiary-container": "#f1a02b",

                        "on-error-container": "#ffdad6",

                    "spacing": {
                        "xl": "64px",
                        "md": "24px",
                        "board-gutter": "2px",
                        "lg": "40px",
                        "sm": "16px",
                        "xs": "8px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],

<style>
        body {
            font-family: 'Geist', sans-serif;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md overflow-hidden">
<!-- Main Game Over Container -->
<main class="w-full max-w-[480px] flex flex-col gap-xl">
<!-- Header Section -->
<header class="flex flex-col items-center justify-center gap-sm text-center">
<h1 class="font-display-lg text-display-lg text-error uppercase tracking-widest drop-shadow-[0_0_8px_rgba(255,180,171,0.2)]">
                GAME OVER
            </h1>
<!-- New High Score Indicator -->
<div class="inline-flex items-center gap-xs px-sm py-xs bg-primary/10 border border-primary text-primary rounded font-label-caps text-label-caps uppercase shadow-[0_0_12px_rgba(142,213,255,0.15)]">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                NEW HIGH SCORE
            </div>
</header>
<!-- Stats Summary -->
<section class="flex flex-col gap-sm w-full">
<!-- Final Score Main Card -->
<div class="bg-surface-container border border-outline-variant p-md rounded flex flex-col items-center justify-center gap-sm relative overflow-hidden group hover:border-primary transition-colors duration-300">
<!-- Subtle grid background effect -->
<div class="absolute inset-0 opacity-10 bg-[linear-gradient(to_right,#3e484f_1px,transparent_1px),linear-gradient(to_bottom,#3e484f_1px,transparent_1px)] bg-[size:1rem_1rem]"></div>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase relative z-10">FINAL SCORE</h2>
<div class="font-display-lg text-display-lg text-primary relative z-10">
                    2,485,910
                </div>
</div>
<!-- Secondary Stats Grid -->
<div class="grid grid-cols-2 gap-sm w-full">
<!-- Level Reached -->
<div class="bg-surface-container border border-outline-variant p-sm rounded flex flex-col items-start gap-xs hover:border-outline transition-colors">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">LEVEL REACHED</h3>
<div class="font-stat-value text-stat-value text-on-surface w-full text-right">
                        24
                    </div>
</div>
<!-- Lines Cleared -->
<div class="bg-surface-container border border-outline-variant p-sm rounded flex flex-col items-start gap-xs hover:border-outline transition-colors">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">LINES CLEARED</h3>
<div class="font-stat-value text-stat-value text-on-surface w-full text-right">
                        214
                    </div>
</div>
</div>
</section>
<!-- Action Buttons -->
<nav class="flex flex-col gap-sm w-full mt-sm">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-sm px-md rounded font-label-caps text-label-caps uppercase flex items-center justify-center gap-xs hover:bg-surface-tint hover:shadow-[0_0_16px_rgba(142,213,255,0.3)] transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">replay</span>
                REPLAY
            </button>
<!-- Secondary Actions -->
<div class="grid grid-cols-2 gap-sm w-full">
<button class="w-full bg-transparent border border-outline-variant text-on-surface py-sm px-sm rounded font-label-caps text-label-caps uppercase flex items-center justify-center gap-xs hover:border-primary hover:text-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">home</span>
                    MAIN MENU
                </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface py-sm px-sm rounded font-label-caps text-label-caps uppercase flex items-center justify-center gap-xs hover:border-primary hover:text-primary transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">share</span>
                    SHARE SCORE
                </button>
</div>
</nav>
</main>
</body></html>
